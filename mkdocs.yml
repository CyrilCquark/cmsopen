# The pages in docs/ are generated by scripts/apply_production.py from results/production.json; they do not exist
# until that step has run, so `mkdocs build --strict` is meaningful only afterwards.
site_name: cmsopen
site_description: End-to-end analysis of CMS open data, from NanoAOD files to the Z and J/psi peaks
repo_url: https://github.com/CyrilCquark/cmsopen
docs_dir: docs
strict: true
theme:
  name: material
  features:
    - navigation.sections
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
nav:
  - Home: index.md
  - Physics background: physics.md
  - User guide: user_guide.md
  - API reference: api.md
  - Validation and systematics: validation.md
  - Reproducibility: reproducibility.md
  - Changelog: changelog.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            members_order: source
            heading_level: 3
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true

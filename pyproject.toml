[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cmsopen"
dynamic = ["version"]  # single source: cmsopen.__version__ (src/cmsopen/__init__.py)
description = "End-to-end analysis of CMS open data: from NanoAOD ROOT files to the Z boson mass peak"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cyril Nadar" }]
dependencies = [
    "uproot>=5",
    "awkward>=2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "hist>=2.7",
    "particle>=0.24",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/CyrilCquark/cmsopen"
Repository = "https://github.com/CyrilCquark/cmsopen"
Issues = "https://github.com/CyrilCquark/cmsopen/issues"

[project.scripts]
cmsopen = "cmsopen.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-timeout>=2.3",
    "mypy",
    "ruff",
    "jupyter",
    "nbformat",
    "vector>=1.3",
    "build",
    "twine",
    "setuptools>=77",
]

[tool.setuptools.dynamic]
version = { attr = "cmsopen.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cmsopen = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes more than about 5 s, or reads the real data file, or runs the 1,000-toy pull test (deselect with -m \"not slow\")",
]

[tool.coverage.run]
source = ["cmsopen"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 1

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Third-party packages without type information (no py.typed marker); listed explicitly.
[[tool.mypy.overrides]]
module = ["awkward", "awkward.*", "uproot", "uproot.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.ruff]
# 120 characters: the physics docstrings and formula lines stay readable without excessive wrapping.
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade,
# D100-D104 docstrings on public modules, classes, methods, functions and packages.
select = ["E", "W", "F", "I", "B", "UP", "D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.per-file-ignores]
# Tests and the notebook builder are not public API: no docstring requirement.
"tests/**" = ["D1"]
"examples/build_notebooks.py" = ["D1"]

[tool.ruff.lint.isort]
known-first-party = ["cmsopen"]

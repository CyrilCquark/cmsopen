[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cmsopen"
version = "0.1.0"
description = "End-to-end analysis of CMS open data: from NanoAOD ROOT files to the Z boson mass peak"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cyril Nadar" }]
dependencies = [
    "uproot>=5",
    "awkward>=2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "hist>=2.7",
    "particle>=0.24",
    "vector>=1.3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "nbformat"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
